name: Public release smoke

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  anonymous-download:
    runs-on: windows-latest
    steps:
      - name: Download the public RC6 archive without credentials
        shell: pwsh
        run: |
          $url = 'https://github.com/Treatid2/FOSS-Package-Manager/releases/download/v0.11.0-rc.6/fgpm-reference-tools-win32-x64-v0.11.0-rc.6.zip'
          Invoke-WebRequest -Uri $url -OutFile fgpm.zip -UseBasicParsing
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath fgpm.zip).Hash.ToLowerInvariant()
          $expected = 'b396a7675af15b2252737a41311742f178ceb4e9d83703b20960ed7fbba09701'
          if ($actual -ne $expected) { throw "Archive digest mismatch: $actual" }
          Expand-Archive -LiteralPath fgpm.zip -DestinationPath tool
          & .\tool\fgpm.cmd --version --json
          & .\tool\fgpm.cmd doctor --json
          & .\tool\fgpm.cmd contracts verify --json
